[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vidcurator"
version = "0.1.0"
description = "Running-context controller scaffold for long-video reasoning experiments"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
video = [
  "decord>=0.6.0",
  "opencv-python>=4.10.0",
  "pillow>=10.0.0"
]
models = [
  "torch>=2.4.0",
  "transformers>=4.57.0",
  "accelerate>=1.0.0",
  "qwen-vl-utils>=0.0.8",
  "sentence-transformers>=3.0.0"
]
train = [
  "peft>=0.13.0",
  "trl>=0.11.0",
  "vllm>=0.6.0"
]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0"
]

[tool.setuptools.packages.find]
include = ["vidcurator*"]
